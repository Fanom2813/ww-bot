name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin
            arch: universal
          - runner: windows-latest
            target: windows
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install NSIS (Windows)
        if: matrix.target == 'windows'
        run: choco install nsis -y

      - name: Add NSIS to PATH (Windows)
        if: matrix.target == 'windows'
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build macOS DMG
        if: matrix.target == 'darwin'
        run: wails3 task darwin:dmg:universal

      - name: Prime frontend deps (Windows)
        if: matrix.target == 'windows'
        working-directory: frontend
        run: bun install

      - name: Prime go modules (Windows)
        if: matrix.target == 'windows'
        run: go mod tidy

      - name: Build Windows installer
        if: matrix.target == 'windows'
        run: wails3 task windows:package ARCH=${{ matrix.arch }}

      - name: Upload macOS artifact
        if: matrix.target == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: WWAssist-macOS
          path: bin/WWAssist.dmg

      - name: Upload Windows artifact
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: WWAssist-Windows-${{ matrix.arch }}
          path: bin/WWAssist-${{ matrix.arch }}-installer.exe

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/WWAssist-macOS/WWAssist.dmg
            artifacts/WWAssist-Windows-amd64/WWAssist-amd64-installer.exe
          generate_release_notes: true
